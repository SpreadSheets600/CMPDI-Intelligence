<!doctype html>
<html lang="en" class="h-full">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}CMPDI Intelligence{% endblock %}</title>
<script>
// Theme resolves before first paint so neither mode flashes.
(function () {
  const t = localStorage.getItem('cmpdi-theme') || 'dark';
  document.documentElement.classList.toggle('dark', t === 'dark');
})();
</script>
<link rel="stylesheet" href="{{ url_for('static', filename='fonts/fonts.css') }}">
<script src="{{ url_for('static', filename='vendor/tailwind.js') }}"></script>
<script>
tailwind.config = {
  darkMode: 'class',
  theme: {
    extend: {
      fontFamily: {
        sans: ['Archivo', 'ui-sans-serif', 'sans-serif'],
        mono: ['IBM Plex Mono', 'ui-monospace', 'monospace'],
      },
      // Every palette step is a CSS variable that flips under .dark, so the
      // whole UI re-themes from one place without per-template dark: classes.
      colors: {
        paper: 'rgb(var(--c-paper) / <alpha-value>)',
        white: 'rgb(var(--c-surface) / <alpha-value>)',
        ink: 'rgb(var(--c-ink) / <alpha-value>)',
        seam: 'rgb(var(--c-seam) / <alpha-value>)',
        seamdark: 'rgb(var(--c-seamdark) / <alpha-value>)',
        coal: 'rgb(var(--c-coal) / <alpha-value>)',
        coalsoft: 'rgb(var(--c-coalsoft) / <alpha-value>)',
        coalline: 'rgb(var(--c-coalline) / <alpha-value>)',
        stone: {
          300: 'rgb(var(--c-muted0) / <alpha-value>)',
          400: 'rgb(var(--c-muted1) / <alpha-value>)',
          500: 'rgb(var(--c-muted2) / <alpha-value>)',
          600: 'rgb(var(--c-muted3) / <alpha-value>)',
          700: 'rgb(var(--c-muted4) / <alpha-value>)',
        },
        emerald: {
          50: 'rgb(var(--c-ok-bg) / <alpha-value>)',
          200: 'rgb(var(--c-ok-line) / <alpha-value>)',
          600: 'rgb(var(--c-ok-solid) / <alpha-value>)',
          700: 'rgb(var(--c-ok-text) / <alpha-value>)',
          800: 'rgb(var(--c-ok-text2) / <alpha-value>)',
        },
        red: {
          50: 'rgb(var(--c-bad-bg) / <alpha-value>)',
          200: 'rgb(var(--c-bad-line) / <alpha-value>)',
          300: 'rgb(var(--c-bad-line2) / <alpha-value>)',
          600: 'rgb(var(--c-bad-solid) / <alpha-value>)',
          700: 'rgb(var(--c-bad-text) / <alpha-value>)',
        },
        amber: {
          100: 'rgb(var(--c-warn-bg) / <alpha-value>)',
          900: 'rgb(var(--c-warn-text) / <alpha-value>)',
        },
      },
      boxShadow: {
        card: '0 1px 2px rgb(28 25 23 / 0.05)',
        lift: '0 6px 16px -6px rgb(28 25 23 / 0.15)',
      },
      keyframes: {
        rise: {
          '0%': { opacity: '0', transform: 'translateY(10px)' },
          '100%': { opacity: '1', transform: 'translateY(0)' },
        },
      },
      animation: {
        rise: 'rise .45s cubic-bezier(.16,1,.3,1) both',
      },
    },
  },
}
</script>
<style>
  :root {
    --c-paper: 250 250 249; --c-surface: 255 255 255; --c-ink: 28 25 23;
    --c-seam: 231 229 228; --c-seamdark: 214 211 211;
    --c-coal: 217 119 6; --c-coalsoft: 254 243 226; --c-coalline: 243 221 181;
    --c-muted0: 214 211 211; --c-muted1: 168 162 158; --c-muted2: 120 113 108;
    --c-muted3: 87 83 78; --c-muted4: 68 64 60;
    --c-ok-bg: 236 253 245; --c-ok-line: 167 243 208; --c-ok-solid: 5 150 105;
    --c-ok-text: 4 120 87; --c-ok-text2: 6 95 70;
    --c-bad-bg: 254 242 242; --c-bad-line: 254 202 202; --c-bad-line2: 252 165 165;
    --c-bad-solid: 220 38 38; --c-bad-text: 185 28 28;
    --c-warn-bg: 254 243 199; --c-warn-text: 120 53 15;
    --shadow-card: 0 1px 2px rgb(28 25 23 / 0.05);
  }
  .dark {
    --c-paper: 18 16 14; --c-surface: 31 28 25; --c-ink: 231 229 228;
    --c-seam: 57 52 47; --c-seamdark: 82 75 68;
    --c-coal: 234 138 12; --c-coalsoft: 55 40 15; --c-coalline: 110 78 28;
    --c-muted0: 96 90 84; --c-muted1: 154 147 143; --c-muted2: 145 138 134;
    --c-muted3: 168 162 158; --c-muted4: 196 191 188;
    --c-ok-bg: 12 46 34; --c-ok-line: 27 84 61; --c-ok-solid: 16 185 129;
    --c-ok-text: 110 231 183; --c-ok-text2: 134 239 200;
    --c-bad-bg: 53 20 20; --c-bad-line: 114 38 38; --c-bad-line2: 142 48 48;
    --c-bad-solid: 225 70 70; --c-bad-text: 248 113 113;
    --c-warn-bg: 62 44 12; --c-warn-text: 252 211 77;
    --shadow-card: 0 1px 2px rgb(0 0 0 / 0.4);
  }
  html { scroll-behavior: smooth; }
  ::selection { background: rgb(var(--c-coal) / 0.25); }
  .shadow-card { box-shadow: var(--shadow-card); }
</style>
<script src="{{ url_for('static', filename='js/app.js') }}" defer></script>
</head>
<body class="min-h-dvh bg-paper font-sans text-ink antialiased">
{% include "components/sidebar.html" %}
<div id="sidebar-backdrop" class="fixed inset-0 z-30 hidden bg-ink/50 md:hidden"></div>
<main id="app-main" class="min-h-dvh px-5 pb-24 pt-8 transition-[margin] duration-200 md:px-8"
      style="margin-left: var(--sidebar-w, 240px)">
  <div class="mx-auto max-w-6xl">
    {% block body %}{% endblock %}
  </div>
  <footer class="mt-16 border-t border-seam pt-6 text-center text-[13px] text-stone-500">
    CMPDI Intelligence · evidence-backed reporting for coal · runs entirely offline
  </footer>
</main>
{% block scripts %}{% endblock %}
</body>
</html>
