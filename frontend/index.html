<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="utf-8" />

    <title>CMPDI Intelligence</title>
    <meta name="description" content="Offline document intelligence for coal, mining and geology reporting — every number, with its receipt." />
    <script>
      // Theme resolves before first paint so neither mode flashes.
      (function () {
        var t = localStorage.getItem('cmpdi-theme') || 'dark';
        document.documentElement.classList.toggle('dark', t === 'dark');
      })();
    </script>

    <script type="module" src="/src/main.jsx"></script>
  </body>
