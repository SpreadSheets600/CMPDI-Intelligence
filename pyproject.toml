[project]
name = "cmpdi-intel"
version = "0.1.0"
description = "AI-Powered Geological, Mining and Reporting Solution for CMPDI/CIL: offline document intelligence platform"
requires-python = ">=3.11"
dependencies = [
    "pymupdf>=1.24",
    "pytesseract>=0.3.10",
    "python-docx>=1.1",
    "docxtpl>=0.16",
    "markdown>=3.6",
    "htmldocx>=0.0.6",
    "openpyxl>=3.1",
    "flask>=3.0",
    "matplotlib>=3.8",
    "wordcloud>=1.9",
    "rapidfuzz>=3.6",
    "sentence-transformers>=3.0",
    "numpy>=1.26",
    "faiss-cpu>=1.9",
]

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.uv]
package = false
